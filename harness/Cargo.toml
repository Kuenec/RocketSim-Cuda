[package]
name = "rsv3_harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
glam = "0.34"
rocketsim = { git = "https://github.com/ZealanL/RocketSim", tag = "v0.3.6", features = ["serde"] }
rocketsim_test = { git = "https://github.com/ZealanL/RocketSim", tag = "v0.3.6" }
serde = { version = "1", features = ["derive"] }

[features]
native-math = ["rocketsim/native-math"]
box-triangle-gjk = ["rocketsim/box-triangle-gjk"]

[profile.release]
debug = true
lto = true
panic = "abort"
codegen-units = 1
